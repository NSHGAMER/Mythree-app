<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Mythree</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: #fbf6ec; color: #2e1d12; text-align: center; padding: 24px; }
      @media (prefers-color-scheme: dark) { body { background: #15100d; color: #f6ecdd; } p { color: #a68e76 !important; } }
      img { width: 96px; height: 96px; border-radius: 999px; }
      h1 { font-family: Georgia, serif; font-weight: 400; margin: 16px 0 8px; }
      p { color: #85695a; max-width: 380px; margin: 0 auto; }
      .btn { display: inline-block; text-decoration: none; margin-top: 20px; background: #7a1f2b; color: #fffaf0; border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/logo.png" alt="Mythree" />
      <h1>You are offline</h1>
      <p>Mythree needs an internet connection for tests, challenges and payments. Nothing is submitted while you are offline. Please reconnect and try again.</p>
      <a class="btn" href="/">Try again</a>
    </main>
  </body>
</html>
