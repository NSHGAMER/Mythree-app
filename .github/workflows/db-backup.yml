# Nightly encrypted logical backup of the Supabase database (free: GitHub Actions minutes).
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL      – Session-pooler connection string (postgresql://postgres.<ref>:<password>@aws-0-ap-south-1.pooler.supabase.com:5432/postgres)
#   BACKUP_PASSPHRASE    – long random passphrase used to encrypt the dump (store it in the admin password manager too)
# Nothing secret is echoed; the dump is encrypted before it is uploaded as a private workflow artifact.
name: Database backup

on:
  schedule:
    - cron: '30 20 * * *' # 02:00 IST every day
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check secrets are configured
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::error::SUPABASE_DB_URL and BACKUP_PASSPHRASE secrets are required"; exit 1
          fi

      - name: Dump roles, schema and data with pg_dump 17
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backup
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # public + auth schemas hold all member data; storage objects metadata is included via the storage schema
          docker run --rm -e DB_URL -v "$PWD/backup:/backup" postgres:17 bash -c '
            pg_dump "$DB_URL" --format=custom --no-owner --no-privileges \
              --schema=public --schema=auth --schema=storage \
              --file=/backup/mythree.dump 2> /backup/pg_dump.log' \
            || { echo "::error::pg_dump failed (see redacted log)"; sed -E "s#postgres(ql)?://[^ ]+#<redacted>#g" backup/pg_dump.log; exit 1; }
          ls -lh backup/mythree.dump | awk '{print "dump size: " $5}'

      - name: Verify the dump is readable
        run: docker run --rm -v "$PWD/backup:/backup" postgres:17 pg_restore --list /backup/mythree.dump > /dev/null

      - name: Encrypt
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASS" --symmetric --cipher-algo AES256 \
            --output "backup/mythree-${STAMP}.dump.gpg" backup/mythree.dump
          sha256sum "backup/mythree-${STAMP}.dump.gpg" | cut -d' ' -f1 > "backup/mythree-${STAMP}.sha256"
          rm -f backup/mythree.dump backup/pg_dump.log

      - name: Upload encrypted backup (private artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mythree-db-${{ env.STAMP }}
          path: backup/
          retention-days: 30
          if-no-files-found: error
